services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: sentry-freshdesk-azurite
    # Blob/queue are used by the Functions host (timer locks), table holds sync state.
    command: >
      azurite
      --blobHost 0.0.0.0
      --queueHost 0.0.0.0
      --tableHost 0.0.0.0
      --location /data
      --skipApiVersionCheck
    ports:
      - "127.0.0.1:10000:10000"
      - "127.0.0.1:10001:10001"
      - "127.0.0.1:10002:10002"
    volumes:
      - azurite-data:/data
    restart: unless-stopped

volumes:
  azurite-data:
